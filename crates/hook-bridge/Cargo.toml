[package]
name = "commit-casino-bridge"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.18", features = ["v4", "serde"] }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
getrandom = "0.3"
fs2 = "0.4"

[dev-dependencies]
tempfile = "3.23"
